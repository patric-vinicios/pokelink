; PokéLink — PHP runtime configuration
; Mounted at /usr/local/etc/php/conf.d/99-pokelink.ini, so it loads last and
; wins over the image defaults.

memory_limit = 512M
max_execution_time = 120

upload_max_filesize = 20M
post_max_size = 20M

date.timezone = America/Sao_Paulo

; Surface everything: the delivery target is a local evaluation stack and a
; silent notice is worth less than a legible one in `docker compose logs app`.
error_reporting = E_ALL
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Opcache is on, with revalidation, because the source is bind-mounted for
; development — an edited PHP file must take effect without an image rebuild.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

realpath_cache_size = 4096k
realpath_cache_ttl = 600
