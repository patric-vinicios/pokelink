; PokéLink — PHP-FPM pool configuration
; Loaded from /usr/local/etc/php-fpm.d/zz-pokelink.conf, after the image's
; www.conf, so these values override it.

[www]
; No user/group directive: the pool inherits the container user, which Compose
; sets to the host's UID/GID so bind-mounted files stay writable by their owner.

; Nginx runs in its own container and reaches FPM over the compose network,
; so the pool listens on a TCP socket rather than a unix socket.
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Without this, PHP-FPM strips the container environment and every value the
; application reads from Compose (DB_HOST, REDIS_HOST, ...) comes back empty.
clear_env = no

; Send worker output to the container log instead of a file inside the image.
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
