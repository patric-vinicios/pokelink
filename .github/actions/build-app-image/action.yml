name: Build app image
description: >
  Builds the PokéLink app image (docker/php/Dockerfile, target final) and
  loads it into the runner's Docker daemon as pokelink-app:ci, with GitHub
  Actions layer caching shared across every workflow that uses this action.

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v3

    - uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/php/Dockerfile
        target: final
        tags: pokelink-app:ci
        load: true
        cache-from: type=gha,scope=pokelink-app
        cache-to: type=gha,mode=max,scope=pokelink-app
