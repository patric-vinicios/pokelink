name: security

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No app image needed here — composer.lock is all `audit` reads. Same
      # disposable composer:2 container gates/security.sh uses locally,
      # since the app image doesn't ship a composer binary. $PWD (not the
      # github.workspace expression) matches gates/security.sh exactly, and
      # sidesteps whatever mangled the expression's substitution in-flight
      # on an earlier run (docker saw `-v :/app`, an empty host path).
      #
      # `audit` fetches the advisory database over the network — GitHub
      # Actions runners share IP ranges saturated with traffic from every
      # other workflow on the platform, so unauthenticated calls to
      # GitHub's own API routinely hit its anonymous rate limit there in a
      # way a single home connection never does (this failed 3 times
      # straight in CI while reproducing clean, every time, run locally in
      # between). COMPOSER_AUTH with the workflow's own auto-issued
      # GITHUB_TOKEN authenticates those calls instead — no secret to
      # configure, GitHub provides this token to every workflow run.
      # Retried too: a real advisory fails identically every attempt, so
      # this doesn't mask one.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if docker run --rm -v "$PWD":/app -w /app \
              -e COMPOSER_AUTH="{\"github-oauth\":{\"github.com\":\"${GH_TOKEN}\"}}" \
              composer:2 audit; then
              exit 0
            fi
            echo "audit attempt ${attempt} failed, retrying..." >&2
            sleep 5
          done
          exit 1
