name: security

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No app image needed here — composer.lock is all `audit` reads. Same
      # disposable composer:2 container gates/security.sh uses locally,
      # since the app image doesn't ship a composer binary. $PWD (not the
      # github.workspace expression) matches gates/security.sh exactly, and
      # sidesteps whatever mangled the expression's substitution in-flight
      # on an earlier run (docker saw `-v :/app`, an empty host path).
      #
      # `audit` calls packagist.org/api/security-advisories/ (confirmed via
      # `composer audit -vvv` — it's Packagist's own advisory API, not
      # GitHub's, so authenticating with GITHUB_TOKEN was the wrong fix and
      # has been removed). This has failed 3 times straight in CI while
      # reproducing clean every single time run locally in between — not a
      # code issue, some flakiness reaching that specific endpoint from the
      # runner network. 5 attempts with a longer backoff than before; a
      # genuine advisory would still fail all of them identically.
      - run: |
          for attempt in 1 2 3 4 5; do
            if docker run --rm -v "$PWD":/app -w /app composer:2 audit --locked --no-interaction; then
              exit 0
            fi
            echo "audit attempt ${attempt} failed, retrying..." >&2
            sleep $((attempt * 10))
          done
          exit 1
