name: unused-deps

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unused-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-app-image
      - run: docker run --rm -e CONTAINER_ROLE=ci pokelink-app:ci vendor/bin/composer-unused
