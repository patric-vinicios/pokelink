name: unused-deps

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unused-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-app-image
      # laravel/reverb excluded: driven by `reverb:start` and config/reverb.php,
      # never a `use Laravel\Reverb\...` statement composer-unused could see.
      - run: docker run --rm -e CONTAINER_ROLE=ci pokelink-app:ci vendor/bin/composer-unused --excludePackage=laravel/reverb
